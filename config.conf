#!/bin/bash
# ============================================================================
# MineGuard - 轻量级服务器监控 & 挖矿检测守护进程
# 配置文件
# ============================================================================

# ----------------------------------------------------------------------------
# 基础配置
# ----------------------------------------------------------------------------
# 监控检查间隔（秒），建议 30-120
CHECK_INTERVAL=30

# 日志文件路径
LOG_FILE="/var/log/mineguard/mineguard.log"

# 日志最大大小（MB），超过后自动轮转
LOG_MAX_SIZE_MB=50

# PID 文件
PID_FILE="/var/run/mineguard.pid"

# 状态数据目录（用于存储告警冷却状态等）
STATE_DIR="/var/lib/mineguard"

# ----------------------------------------------------------------------------
# CPU 监控阈值
# ----------------------------------------------------------------------------
# CPU 使用率告警阈值（%），单次超过此值触发检查
CPU_WARN_THRESHOLD=80

# CPU 使用率严重告警阈值（%）
CPU_CRIT_THRESHOLD=95

# 持续高 CPU 检测次数：连续 N 次检测超过阈值才告警
# 用于过滤短暂的 CPU 峰值，挖矿程序通常持续占用
CPU_SUSTAINED_COUNT=3

# 单进程 CPU 占用告警阈值（%）
PROCESS_CPU_THRESHOLD=70

# ----------------------------------------------------------------------------
# 内存监控阈值
# ----------------------------------------------------------------------------
# 内存使用率告警阈值（%）
MEM_WARN_THRESHOLD=85

# 内存使用率严重告警阈值（%）
MEM_CRIT_THRESHOLD=95

# Swap 使用率告警阈值（%），0 表示禁用
SWAP_WARN_THRESHOLD=50

# ----------------------------------------------------------------------------
# 挖矿检测配置
# ----------------------------------------------------------------------------
# 是否启用挖矿进程名称特征检测（1=启用，0=禁用）
MINING_NAME_DETECT=1

# 是否启用挖矿网络连接检测（1=启用，0=禁用）
# 检测到矿池端口连接时告警
MINING_NET_DETECT=1

# 挖矿特征签名文件路径
MINING_SIGNATURES_FILE="/etc/mineguard/mining_signatures.txt"

# 是否自动 kill 检测到的挖矿进程（1=启用，0=禁用）
# ⚠️ 谨慎开启，可能误杀正常进程
AUTO_KILL_MINER=0

# ----------------------------------------------------------------------------
# 通知配置 - Telegram
# ----------------------------------------------------------------------------
# 是否启用 Telegram 通知（1=启用，0=禁用）
TELEGRAM_ENABLED=0

# Telegram Bot Token（从 @BotFather 获取）
TELEGRAM_BOT_TOKEN=""

# Telegram Chat ID（可以是个人/群组/频道 ID）
TELEGRAM_CHAT_ID=""

# ----------------------------------------------------------------------------
# 通知配置 - Webhook（兼容企业微信/钉钉/自定义）
# ----------------------------------------------------------------------------
# 是否启用 Webhook 通知（1=启用，0=禁用）
WEBHOOK_ENABLED=0

# Webhook URL
WEBHOOK_URL=""

# Webhook 请求方法（POST/GET）
WEBHOOK_METHOD="POST"

# Webhook Content-Type
WEBHOOK_CONTENT_TYPE="application/json"

# Webhook 消息模板
# 可用变量: {{HOSTNAME}}, {{LEVEL}}, {{TITLE}}, {{MESSAGE}}, {{TIMESTAMP}}
WEBHOOK_TEMPLATE='{"msgtype":"text","text":{"content":"[{{LEVEL}}] {{HOSTNAME}}\n{{TITLE}}\n{{MESSAGE}}\n{{TIMESTAMP}}"}}'

# ----------------------------------------------------------------------------
# 通知配置 - 邮件 (SMTP)
# ----------------------------------------------------------------------------
# 是否启用邮件通知（1=启用，0=禁用）
EMAIL_ENABLED=0

# SMTP 服务器
SMTP_SERVER=""

# SMTP 端口
SMTP_PORT=587

# SMTP 用户名
SMTP_USER=""

# SMTP 密码
SMTP_PASS=""

# 发件人地址
EMAIL_FROM=""

# 收件人地址（多个用逗号分隔）
EMAIL_TO=""

# ----------------------------------------------------------------------------
# 告警冷却配置
# ----------------------------------------------------------------------------
# 相同类型告警的冷却时间（秒），避免重复告警轰炸
ALERT_COOLDOWN=300

# 每小时最大告警数量，超过后暂停告警
MAX_ALERTS_PER_HOUR=10

# 系统恢复正常时是否发送恢复通知（1=启用，0=禁用）
SEND_RECOVERY_ALERT=1

# ----------------------------------------------------------------------------
# 白名单配置
# ----------------------------------------------------------------------------
# CPU 高占用白名单进程（正则表达式，用 | 分隔）
# 这些进程即使 CPU 高占用也不会触发告警
CPU_WHITELIST="(compile|gcc|g\+\+|make|apt|dpkg|pip|npm|cargo|rustc)"

# 网络连接白名单端口（挖矿网络检测时忽略这些端口）
NET_WHITELIST_PORTS="80|443|22|53|25|587|993|995"
